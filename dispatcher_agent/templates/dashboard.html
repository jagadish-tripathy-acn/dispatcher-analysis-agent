<!DOCTYPE html>
<html lang="en" data-palette="#2a78d6,#d03b3b,#eda100,#4a3aa7">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher Insights</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- chrono-node has no UMD build (its package entry is CommonJS), so a plain
     <script src> leaves no global behind. Load the ESM bundle and publish it,
     then tell the page so the Ask box can re-parse what is already typed. It
     is strictly optional: parseNL()'s own patterns cover the common phrasings
     and it degrades to a hint if this never arrives. -->
<script type="module">
  try{
    const chrono = await import("https://cdn.jsdelivr.net/npm/chrono-node@2.7.7/+esm");
    window.chrono = chrono;
    window.dispatchEvent(new Event("chrono-ready"));
  }catch(e){ console.warn("free-text date parser unavailable:", e); }
</script>
<style>
/* ══ tokens ════════════════════════════════════════════════════════════
   Light theme only. Surfaces are white so every data colour below was
   validated against #ffffff (scripts/validate_palette.js, --mode light). */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#fafaf9; --surface-3:#f2f2f0;
  --line:#e5e4df; --line-2:#d6d5cf; --line-3:#bfbeb8;
  --ink:#1b1b19; --ink-2:#57564f; --ink-3:#8a8880;
  --accent:#2a78d6; --accent-soft:#eaf1fb;

  /* data series — validated set: #2a78d6,#d03b3b,#eda100,#4a3aa7 */
  --c-complete:#2a78d6; --c-terminal:#d03b3b; --c-queued:#eda100; --c-active:#4a3aa7;
  --c-alt:#eb6834;                     /* second line in two-series charts */
  --c-spark:#a8c4e6;

  /* status — reserved, never reused as a series colour */
  --st-good:#0ca30c; --st-warning:#fab219; --st-serious:#ec835a; --st-critical:#d03b3b;

  --mono:ui-monospace,"Cascadia Mono","Consolas","Roboto Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(27,27,25,.05);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
     -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ══ header ═══════════════════════════════════════════════════════════ */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);
        padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:16px}
.brand .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);
  border-radius:4px;padding:1px 5px}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:14px;
  font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.ghost{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
  padding:5px 11px;font-size:12px;color:var(--ink-2)}
.ghost:hover{background:var(--surface-3);border-color:var(--line-3)}
.ghost:disabled{opacity:.5;cursor:default}
.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;
  border-radius:6px;padding:6px 13px;font-size:12px;font-weight:600}
.primary:hover{background:#1f66bd}
.primary:disabled{opacity:.55;cursor:default}

/* ══ filter row — one row, above everything it affects ════════════════ */
.filters{background:var(--surface);border-bottom:1px solid var(--line);
  padding:9px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20}
.flabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);
  padding:5px 10px;font-size:12px;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-3)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:#1b4f8f;font-weight:600}
input[type="date"],input[type="text"],select{background:var(--surface);
  border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font:12px var(--sans);
  color:var(--ink)}
input[type="date"]{font-family:var(--mono);font-size:11.5px}
input:focus,select:focus,button:focus-visible,[role="button"]:focus-visible{
  outline:2px solid #7aa9e4;outline-offset:1px}
#nl{width:230px}
.nlnote{font-size:11px;font-family:var(--mono);color:var(--ink-3)}
.nlnote .ok{color:#1f66bd}
.nlnote .bad{color:#a72d2d}
.divider{width:1px;height:22px;background:var(--line)}

/* ══ layout ═══════════════════════════════════════════════════════════ */
main{padding:18px 22px 48px;max-width:1680px;margin:0 auto}
main.busy{opacity:.45;pointer-events:none;transition:opacity .12s}
section{margin-bottom:18px}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.shead h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.shead .hint{font-size:11.5px;color:var(--ink-3)}
.shead .right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ══ system strip ═════════════════════════════════════════════════════ */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow)}
.st{background:var(--surface);padding:11px 13px 12px}
.st .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;
  font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.st .s{font-size:11px;color:var(--ink-3);margin-top:2px;font-family:var(--mono)}
.st.hero{background:var(--surface)}
.st.hero .v{font-size:32px;letter-spacing:-.03em}

/* ══ job indicator boxes ══════════════════════════════════════════════ */
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:12px}
.jbox{--sev:var(--line-2);--tint:transparent;
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--sev);border-radius:var(--radius);padding:12px 13px 11px;
  box-shadow:var(--shadow);text-align:left;display:block;width:100%;
  transition:box-shadow .12s,transform .12s}
.jbox:hover{box-shadow:0 3px 10px rgba(27,27,25,.10);transform:translateY(-1px)}
.jbox[aria-pressed="true"]{border-color:var(--accent);border-left-color:var(--sev);
  box-shadow:0 0 0 2px var(--accent-soft)}
.jbox.flagged{background:
  linear-gradient(var(--tint),var(--tint)) padding-box,var(--surface)}
.jb-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.jb-name{font-size:13.5px;font-weight:600;line-height:1.25;word-break:break-word}
.jb-sev{margin-left:auto;flex:none}
.jb-fig{display:flex;align-items:baseline;gap:6px}
.jb-fig .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;
  font-weight:600;letter-spacing:-.02em}
.jb-fig .u{font-size:11px;color:var(--ink-3)}
.jb-fig .share{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.meter{display:flex;gap:2px;height:7px;margin:8px 0 7px;background:var(--surface-3);
  border-radius:3px;overflow:hidden}
.meter i{display:block;min-width:2px}
.jb-legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink-2)}
.jb-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.jb-legend b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.d-complete{background:var(--c-complete)} .d-terminal{background:var(--c-terminal)}
.d-queued{background:var(--c-queued)}     .d-active{background:var(--c-active)}
.d-dropped{background:#a9a8a1}
.jb-stats{display:flex;gap:14px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.jb-stats b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);
  font-weight:600;font-size:11.5px}
.jb-spark{display:block;width:100%;height:22px;margin-top:9px}
.jb-flags{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.jb-cta{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.jbox:hover .jb-cta{text-decoration:underline}
.jb-ok{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3)}

/* severity: colour + glyph + word, never colour alone */
.jbox.sev-critical{--sev:var(--st-critical);--tint:rgba(208,59,59,.045)}
.jbox.sev-high    {--sev:var(--st-serious); --tint:rgba(236,131,90,.06)}
.jbox.sev-medium  {--sev:var(--st-warning); --tint:rgba(250,178,25,.07)}
.jbox.sev-low     {--sev:var(--ink-3);      --tint:rgba(138,136,128,.05)}
.jbox.sev-ok      {--sev:#cfe6cf}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);
  background:var(--surface-2);border-radius:11px;padding:1px 8px;font-size:10.5px;
  font-weight:600;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap}
.chip .g{font-size:10px;line-height:1}
.chip.critical{border-color:#e7a9a9;background:#fdf1f1;color:#962626}
.chip.serious {border-color:#f2c2ab;background:#fdf3ee;color:#9c4a26}
.chip.warning {border-color:#f0d79a;background:#fdf7e8;color:#87611a}
.chip.good    {border-color:#b6ddb6;background:#f0f8f0;color:#186b18}
.chip.info    {border-color:var(--line-2);background:var(--surface-3);color:var(--ink-2)}
.chip.flag{font-weight:500;letter-spacing:0;font-size:11px;text-transform:none}

/* ══ cards & panel ════════════════════════════════════════════════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.panel-head{display:flex;gap:14px;align-items:flex-start;padding:14px 16px 12px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font-size:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel-sub{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:4px}
.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);
  background:var(--surface-2);border-radius:0;flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;
  padding:9px 12px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{font-family:var(--mono);font-size:10.5px;background:var(--surface-3);
  border:1px solid var(--line);border-radius:9px;padding:0 5px;color:var(--ink-3)}
.tabbody{padding:16px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
figure.chart{margin:0;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);padding:12px 14px 10px}
figure.chart.span{grid-column:1/-1}
figcaption{margin-bottom:10px}
figcaption h3{font-size:12.5px}
figcaption .note{margin:2px 0 0;font-size:11px;color:var(--ink-3)}
.cwrap{position:relative;height:230px}
.cwrap.tall{height:300px}
.cwrap.short{height:180px}
details.dt{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
details.dt summary{font-size:11px;color:var(--ink-3);cursor:pointer;list-style:none}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary::before{content:"▸ ";font-size:9px}
details.dt[open] summary::before{content:"▾ "}
details.dt .scroll{max-height:220px;overflow:auto;margin-top:6px}

/* ══ tables ═══════════════════════════════════════════════════════════ */
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;background:var(--surface-2);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
.tscroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px}
.pill{display:inline-block;border-radius:10px;padding:1px 7px;font-size:10.5px;
  font-weight:600;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.pill.s-COMPLETE{border-color:#aecbec;background:#eef4fc;color:#1b4f8f}
.pill.s-TERMINAL{border-color:#e7a9a9;background:#fdf1f1;color:#96262e}
.pill.s-SCHEDULED{border-color:#f0d79a;background:#fdf7e8;color:#87611a}
.pill.s-TRANSLATING,.pill.s-LOADING,.pill.s-PREPARING,.pill.s-INITIAL{
  border-color:#c3bce6;background:#f1effa;color:#3b2f8c}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;
  font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}

/* ══ anomalies & RCA ══════════════════════════════════════════════════ */
.anom{border:1px solid var(--line);border-left:3px solid var(--sev,var(--line-2));
  border-radius:8px;padding:11px 13px;margin-bottom:10px;background:var(--surface)}
.anom.sev-critical{--sev:var(--st-critical)} .anom.sev-high{--sev:var(--st-serious)}
.anom.sev-medium{--sev:var(--st-warning)}    .anom.sev-low{--sev:var(--ink-3)}
.anom h4{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.anom p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
.cmp{display:grid;grid-template-columns:104px 1fr 92px;gap:6px 10px;align-items:center;
  margin-top:9px;font-size:11px;color:var(--ink-3)}
.cmp .bar{height:7px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:3px}
.cmp .val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);
  text-align:right;font-size:11.5px}
.samples{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tid{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);
  background:var(--surface-2);border-radius:4px;padding:1px 6px;color:var(--ink-2)}
button.tid:hover{border-color:var(--accent);color:var(--accent)}
.rca{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);
  padding:14px 16px;margin-top:6px}
.rca h3{font-size:13px;margin-bottom:4px}
.rca .lead{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.rca .primary-cause{background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;margin-bottom:14px}
.rca .primary-cause .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3)}
.rca .primary-cause .t{font-size:13.5px;font-weight:600;margin-top:3px}
.rca h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  margin:16px 0 8px}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rlist li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.rlist .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600}
.rlist .hd .idx{font-family:var(--mono);color:var(--ink-3);font-weight:600;font-size:11px}
.rlist .ev{margin:5px 0 0;font-size:12px;color:var(--ink-2)}
.rlist .meta{margin:5px 0 0;font-size:11.5px;color:var(--ink-3)}
.rlist .meta b{color:var(--ink-2);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.checks li{display:flex;gap:9px;font-size:12.5px;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:8px 11px}
.checks .where{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  white-space:nowrap}
.provenance{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;
  padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);
  font-family:var(--mono)}
.notice{border:1px solid #f0d79a;background:#fdf7e8;color:#7a5714;border-radius:6px;
  padding:8px 11px;font-size:12px;margin-bottom:12px}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:13px}
.spinner{width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.working{display:flex;gap:9px;align-items:center;color:var(--ink-3);font-size:12.5px;padding:14px 0}
.aicard .body{padding:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--mono)}
@media (max-width:720px){
  .topmeta{width:100%;margin-left:0}
  main{padding:14px 12px 40px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media print{.filters,.topbar .right,.tabs{display:none}body{background:#fff}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>Dispatcher Insights</h1>
    <span class="tag">Teamcenter translation pipeline</span>
  </div>
  <div class="topmeta">
    <span id="meta-files">—</span>
    <span id="meta-span">—</span>
    <span id="meta-gen">—</span>
    <button class="ghost" id="btn-reload" title="Re-read the logs and refresh">Refresh</button>
  </div>
</div>

<div class="filters" id="filters">
  <span class="flabel">Window</span>
  <div class="seg" id="presets" role="group" aria-label="Date range presets">
    <button data-days="0"   aria-pressed="true">All</button>
    <button data-days="1">1D</button>
    <button data-days="7">1W</button>
    <button data-days="30">1M</button>
    <button data-days="90">3M</button>
    <button data-days="365">1Y</button>
  </div>
  <div class="divider"></div>
  <label class="flabel" for="d-from">From</label>
  <input type="date" id="d-from">
  <label class="flabel" for="d-to">To</label>
  <input type="date" id="d-to">
  <button class="primary" id="btn-apply">Apply</button>
  <button class="ghost" id="btn-clear">Clear</button>
  <div class="divider"></div>
  <label class="flabel" for="nl">Ask</label>
  <input type="text" id="nl" placeholder="e.g. 2nd week of April 2022" autocomplete="off">
  <span class="nlnote" id="nl-note"></span>
</div>

<main id="main">
  <section id="strip-sec">
    <div class="strip" id="strip"></div>
  </section>

  <section id="jobs-sec">
    <div class="shead">
      <h2>Job types</h2>
      <span class="hint" id="jobs-hint"></span>
      <div class="right">
        <input type="text" id="job-filter" placeholder="Filter job type…" style="width:170px">
        <label class="flabel" for="job-sort">Sort</label>
        <select id="job-sort">
          <option value="severity">Anomaly severity</option>
          <option value="count">Task volume</option>
          <option value="terminal">Failure rate</option>
          <option value="queue">Queue backlog</option>
          <option value="slow">Median completion</option>
          <option value="name">Name</option>
        </select>
        <div class="seg" role="group" aria-label="Show">
          <button id="f-all" aria-pressed="true">All</button>
          <button id="f-flagged" aria-pressed="false">Flagged only</button>
        </div>
      </div>
    </div>
    <div class="jobgrid" id="jobgrid"></div>
  </section>

  <section id="panel-sec">
    <div class="card" id="panel"></div>
  </section>

  <section id="ai-sec">
    <div class="card aicard">
      <div class="panel-head">
        <div>
          <h2>AI analysis</h2>
          <div class="panel-sub">Bedrock reading the whole snapshot — health, anomalies, recommendations</div>
        </div>
        <div class="right">
          <button class="ghost" id="btn-ai">Run analysis</button>
        </div>
      </div>
      <div class="body" id="ai-body">
        <div class="muted" style="font-size:12.5px">Not run yet. This calls the LLM and takes ~10–60 s.</div>
      </div>
    </div>
  </section>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════════ */
const S = {
  from:"", to:"",
  stats:null,
  job:null, detail:null,
  tab:"throughput",
  sort:"severity", flaggedOnly:false, jobQuery:"",
  table:{q:"", status:"all", sort:"slowest", offset:0, limit:50, total:0, rows:[], loading:false},
  rca:{loading:false, data:null, forJob:null},
  charts:{},
  loading:false,
};

const $ = s => document.querySelector(s);
const el = (id) => document.getElementById(id);

/* ═══ formatting ═══════════════════════════════════════════════════════ */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n0 = v => (v==null?"—":Number(v).toLocaleString());
const compact = v => {
  if(v==null) return "—";
  const n = Number(v);
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(Math.abs(n)>=10000) return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";
  return n.toLocaleString();
};
const pct = v => v==null ? "—" : `${Number(v).toFixed(1)}%`;
/** Minutes → readable duration. 706622 min is not a number anyone can read. */
function dur(v){
  if(v==null || v==="") return "—";
  const m = Math.round(Number(v));
  if(!isFinite(m)) return "—";
  if(m <= 0) return "0m";
  if(m < 60) return m+"m";
  if(m < 1440){ const h=Math.floor(m/60), r=m%60; return r? `${h}h ${r}m` : `${h}h`; }
  const d=Math.floor(m/1440), h=Math.round((m%1440)/60);
  return h? `${d}d ${h}h` : `${d}d`;
}
const durShort = v => {
  if(v==null) return "";
  const m=Math.round(Number(v));
  if(m<60) return m+"m";
  if(m<1440) return (m/60).toFixed(m<600?1:0)+"h";
  return (m/1440).toFixed(m<14400?1:0)+"d";
};
const SEV = {
  critical:{cls:"critical", g:"✕", label:"CRITICAL", rank:4},
  high:    {cls:"serious",  g:"▲", label:"HIGH",     rank:3},
  medium:  {cls:"warning",  g:"△", label:"WARN",     rank:2},
  low:     {cls:"info",     g:"ℹ", label:"INFO",     rank:1},
  ok:      {cls:"good",     g:"✓", label:"OK",       rank:0},
};
const sev = s => SEV[s] || SEV.ok;
function sevChip(s, count){
  const d = sev(s);
  const n = count ? ` ${count}` : "";
  return `<span class="chip ${d.cls}"><span class="g" aria-hidden="true">${d.g}</span>${d.label}${n}</span>`;
}
const ANOM = {
  terminal_spike:"failure spike", queue_backlog:"queue backlog",
  latency_drift:"slower than before", latency_outlier:"slower than peers",
  stalled_tasks:"stalled tasks", high_variance:"unstable runtime",
};
const CAT = {capacity:"capacity", configuration:"configuration", input_data:"input data",
  dependency:"dependency", scheduling:"scheduling", infrastructure:"infrastructure",
  user_behaviour:"user behaviour", unknown:"unknown"};
const HORIZON = {immediate:"Do now", short_term:"Short term", preventive:"Prevent recurrence"};
const PRIO_CLS = {critical:"critical", high:"serious", medium:"warning", low:"info"};

/* ═══ Chart.js house style ═════════════════════════════════════════════ */
const C = {blue:"#2a78d6", red:"#d03b3b", amber:"#eda100", violet:"#4a3aa7",
  orange:"#eb6834", ramp:["#86b6ef","#2a78d6","#184f95","#0d366b"],
  grid:"#ececE8", ink2:"#57564f", ink3:"#8a8880", line:"#d6d5cf"};

Chart.defaults.font.family = '"Segoe UI",system-ui,-apple-system,sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.color = C.ink3;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.animation.duration = 260;
Chart.defaults.elements.line.borderWidth = 2;
Chart.defaults.elements.line.tension = .25;
Chart.defaults.elements.point.radius = 0;
Chart.defaults.elements.point.hoverRadius = 4.5;
Chart.defaults.elements.point.hitRadius = 22;
/* Bar geometry is a *dataset* option in Chart.js 4, not an element default, so
   it is applied per dataset via BAR below. Nested default objects are only ever
   patched leaf-by-leaf: replacing plugins.legend.labels wholesale drops
   Chart.js' own generateLabels() and the legend silently disappears. */
const BAR = {maxBarThickness:24, borderRadius:4, borderSkipped:"start"};
/** 2px surface gap on the data end of a stacked segment. */
const GAP_TOP = {borderColor:"#ffffff", borderWidth:{top:2, right:0, bottom:0, left:0}};
Chart.defaults.plugins.legend.position = "top";
Chart.defaults.plugins.legend.align = "end";
Object.assign(Chart.defaults.plugins.legend.labels, {
  usePointStyle:true, pointStyle:"rectRounded", boxWidth:8, boxHeight:8,
  padding:14, color:C.ink2, font:{size:11},
});
Object.assign(Chart.defaults.plugins.tooltip, {
  backgroundColor:"#ffffff", titleColor:"#1b1b19", bodyColor:"#1b1b19",
  borderColor:C.line, borderWidth:1, cornerRadius:6, padding:10, caretSize:5,
  displayColors:true, usePointStyle:true, boxWidth:8, boxHeight:8, boxPadding:4,
  titleFont:{size:11, weight:"600"}, bodyFont:{size:12},
});

/** Vertical hairline under the cursor on time series. */
Chart.register({
  id:"crosshair",
  afterDatasetsDraw(c){
    if(c.config.type !== "line") return;
    const act = c.tooltip && c.tooltip._active;
    if(!act || !act.length) return;
    const g = c.ctx, x = act[0].element.x;
    g.save(); g.beginPath(); g.lineWidth = 1; g.strokeStyle = "#c9c8c2";
    g.moveTo(x, c.chartArea.top); g.lineTo(x, c.chartArea.bottom); g.stroke(); g.restore();
  },
});
/** Selective direct labels at the data end — opt in per chart. */
Chart.register({
  id:"valueLabels",
  afterDatasetsDraw(c, _a, opts){
    if(!opts || !opts.enabled) return;
    const fmt = opts.format || (v => n0(v));
    const horiz = c.options.indexAxis === "y";
    const g = c.ctx;
    g.save();
    g.font = '600 11px ' + Chart.defaults.font.family;
    g.fillStyle = C.ink2;
    c.data.datasets.forEach((ds, i) => {
      if(!c.isDatasetVisible(i)) return;
      c.getDatasetMeta(i).data.forEach((mark, j) => {
        const v = ds.data[j];
        if(v == null || v === 0) return;
        g.textAlign = horiz ? "left" : "center";
        g.textBaseline = horiz ? "middle" : "bottom";
        g.fillText(fmt(v), mark.x + (horiz ? 7 : 0), mark.y + (horiz ? 0 : -5));
      });
    });
    g.restore();
  },
});

const AX = {                                        // recessive grid, one axis
  y:{grid:{color:C.grid, drawTicks:false}, border:{display:false},
     ticks:{padding:6, maxTicksLimit:6}},
  x:{grid:{display:false}, border:{color:C.line},
     ticks:{padding:4, maxRotation:0, autoSkipPadding:14}},
};
const yCat = {grid:{display:false}, border:{display:false}, ticks:{padding:4, font:{size:11}}};
const xNum = {grid:{color:C.grid, drawTicks:false}, border:{display:false},
              ticks:{padding:4, maxTicksLimit:5}};

function destroyCharts(){ Object.values(S.charts).forEach(c => c.destroy()); S.charts = {}; }
function mkChart(id, cfg){
  const cv = el(id);
  if(!cv) return;
  if(S.charts[id]) S.charts[id].destroy();
  S.charts[id] = new Chart(cv, cfg);
}
/** figure + canvas + a "Data table" disclosure, so every chart has a table view. */
function chartCard(id, title, note, opts={}){
  return `<figure class="chart${opts.span?" span":""}">
    <figcaption><h3>${esc(title)}</h3>${note?`<p class="note">${esc(note)}</p>`:""}</figcaption>
    <div class="cwrap${opts.h?" "+opts.h:""}"><canvas id="${id}"></canvas></div>
    <details class="dt"><summary>Data table</summary><div class="scroll" id="${id}-dt"></div></details>
  </figure>`;
}
function fillTable(id, cols, rows){
  const holder = el(id+"-dt");
  if(!holder) return;
  holder.innerHTML = `<table><thead><tr>${
    cols.map((c,i)=>`<th${i?' class="n"':""}>${esc(c)}</th>`).join("")
  }</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((v,i)=>`<td${i?' class="n"':""}>${esc(v)}</td>`).join("")}</tr>`).join("")
  }</tbody></table>`;
}
const BUCKET_WORD = {minute:"minute", hour:"hour", day:"day", month:"month"};

/* ═══════════════════════════════════════════════════════════════════════
   Data loading
   ═══════════════════════════════════════════════════════════════════════ */
function qs(extra={}){
  const p = new URLSearchParams();
  if(S.from) p.set("from", S.from);
  if(S.to)   p.set("to", S.to);
  Object.entries(extra).forEach(([k,v]) => { if(v!=null && v!=="") p.set(k, v); });
  return p.toString();
}
function busy(on){ S.loading = on; el("main").classList.toggle("busy", on); }

async function getJSON(url){
  const r = await fetch(url);
  const data = await r.json().catch(() => ({error:`HTTP ${r.status}`}));
  if(!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

/** Refetch the window. The previous render stays on screen, dimmed. */
async function loadStats(){
  busy(true);
  try{
    S.stats = await getJSON("/api/stats?" + qs());
    if(S.job && !S.stats.job_health.some(j => j.job === S.job)) selectJob(null, {silent:true});
    renderMeta(); renderStrip(); renderJobs();
    if(S.job) await loadJob(S.job, {keepTab:true});
    else renderPanel();
  }catch(e){
    el("strip").innerHTML = `<div class="st" style="grid-column:1/-1"><div class="k">Error</div>
      <div class="v" style="font-size:14px">${esc(e.message)}</div></div>`;
  }finally{ busy(false); }
}

async function loadJob(job, {keepTab=false}={}){
  busy(true);
  try{
    S.detail = await getJSON("/api/job?" + qs({job}));
    S.job = job;
    if(!keepTab) S.tab = "throughput";
    S.rca = {loading:false, data:null, forJob:null};
    renderJobs(); renderPanel();
  }catch(e){
    S.detail = null; S.job = null;
    renderJobs();
    el("panel").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }finally{ busy(false); }
}

/* ── deep links: the selected job, tab and window live in the URL hash ── */
let hashSelf = false, hashRCA = null;
function syncHash(){
  const p = new URLSearchParams();
  if(S.job) p.set("job", S.job);
  if(S.tab !== "throughput") p.set("tab", S.tab);
  if(S.from) p.set("from", S.from);
  if(S.to) p.set("to", S.to);
  const h = p.toString();
  if(h !== location.hash.replace(/^#/, "")){ hashSelf = true; location.hash = h; }
}
function readHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  S.from = p.get("from") || "";
  S.to   = p.get("to")   || "";
  const tab = p.get("tab");
  if(["throughput","dist","tasks","rca"].includes(tab)) S.tab = tab;
  hashRCA = p.get("rca");
  return p.get("job") || null;
}

function selectJob(job, {tab=null, silent=false, autoRCA=false}={}){
  if(job === null){
    S.job = null; S.detail = null; S.tab = "throughput";
    S.table = {...S.table, offset:0, q:"", status:"all"};
    if(!silent){ renderJobs(); renderPanel(); }
    return;
  }
  if(S.job === job && !tab){ selectJob(null); return; }   // click again to close
  S.table = {...S.table, offset:0, q:"", status:"all"};
  return loadJob(job).then(() => {
    if(tab){ S.tab = tab; renderPanel(); }
    if(autoRCA && S.tab === "rca") runRCA();
    if(!silent) el("panel-sec").scrollIntoView({behavior:"smooth", block:"start"});
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   Header meta + system strip
   ═══════════════════════════════════════════════════════════════════════ */
function renderMeta(){
  const s = S.stats, span = s.data_span || {};
  el("meta-files").textContent = `${(s.files_read||[]).length} log file(s)`;
  el("meta-span").textContent = span.from ? `data ${span.from} → ${span.to}` : "no data";
  el("meta-gen").textContent = s.generated_at ? `read ${s.generated_at}` : "";
}

function renderStrip(){
  const s = S.stats, k = s.kpis, b = s.baselines || {};
  const win = (S.from || S.to) ? `${S.from||"start"} → ${S.to||"end"}` : "all logged time";
  const tiles = [
    {k:"Tasks in window", v:n0(k.total_tasks), s:win, hero:true},
    {k:"Completed",  v:n0(k.completed),     s:`${pct(b.completed_pct)} of tasks`},
    {k:"Terminal",   v:n0(k.terminal_jobs), s:`${pct(k.terminal_pct)} of tasks`},
    {k:"In queue",   v:n0(k.in_queue),           s:`${pct(k.in_queue_pct)} · never picked up`},
    {k:"Mid-flight", v:n0(k.other),              s:"translating / loading"},
    {k:"Median completion", v:dur(b.p50_total),  s:`p95 ${dur(b.p95_total)}`},
    {k:"Median queue wait", v:dur(b.p50_queue),  s:`avg processing ${dur(k.avg_proc_min)}`},
    {k:"Anomaly signals", v:n0(s.anomaly_total),
     s:`${s.anomalous_jobs} of ${b.job_types} job types`,
     chip:s.anomaly_total ? sevChip(s.worst_severity) : sevChip("ok")},
  ];
  el("strip").innerHTML = tiles.map(t => `<div class="st${t.hero?" hero":""}">
      <div class="k">${esc(t.k)}</div>
      <div class="v">${t.v}</div>
      <div class="s">${t.chip ? t.chip : esc(t.s)}</div>
    </div>`).join("");
}

/* ═══════════════════════════════════════════════════════════════════════
   Job indicator boxes
   ═══════════════════════════════════════════════════════════════════════ */
const JOB_SORTS = {
  severity: (a,b) => sev(b.severity).rank - sev(a.severity).rank || b.count - a.count,
  count:    (a,b) => b.count - a.count,
  terminal: (a,b) => b.terminal_pct - a.terminal_pct || b.terminal - a.terminal,
  queue:    (a,b) => b.in_queue - a.in_queue || b.in_queue_pct - a.in_queue_pct,
  slow:     (a,b) => b.p50_total - a.p50_total,
  name:     (a,b) => a.job.localeCompare(b.job),
};

function sparkSVG(spark, job){
  const pts = spark || [];
  if(!pts.length) return "";
  const max = Math.max(1, ...pts.map(p => p.n));
  const W = 4, G = 1, H = 24;
  const bars = pts.map((p,i) => {
    const x = i*(W+G);
    const h = p.n ? Math.max(1, Math.round(p.n / max * H)) : 0;
    const fh = p.fail ? Math.max(1, Math.round(p.fail / max * H)) : 0;
    let out = "";
    if(h) out += `<rect x="${x}" y="${H-h}" width="${W}" height="${h}" fill="var(--c-spark)"/>`;
    if(fh) out += `<rect x="${x}" y="${H-fh}" width="${W}" height="${fh}" fill="var(--c-terminal)"/>`;
    return out;
  }).join("");
  const total = pts.reduce((a,p)=>a+p.n,0), fails = pts.reduce((a,p)=>a+p.fail,0);
  return `<svg class="jb-spark" viewBox="0 0 ${pts.length*(W+G)} ${H}" preserveAspectRatio="none"
    role="img" aria-label="Volume over the window for ${esc(job)}: ${total} tasks, ${fails} failed">
    ${bars}</svg>`;
}

function jobBox(j){
  const d = sev(j.severity);
  const flagged = j.anomaly_count > 0;
  const total = Math.max(1, j.count);
  /* DELETE and DUPLICATE are neither success nor failure — they get the
     neutral slot, not the red one, and they are named in the legend so the
     four numbers always add up to the task total. */
  const dropped = (j.deleted||0) + (j.duplicate||0);
  const segs = [
    {n:j.completed, c:"var(--c-complete)", label:"completed"},
    {n:j.terminal,  c:"var(--c-terminal)", label:"failed"},
    {n:j.in_queue,  c:"var(--c-queued)",   label:"queued"},
    {n:j.active,    c:"var(--c-active)",   label:"mid-flight"},
    {n:dropped,     c:"#a9a8a1",           label:"cancelled or duplicate"},
  ].filter(x => x.n > 0);
  const share = S.stats.kpis.total_tasks ? (j.count / S.stats.kpis.total_tasks * 100) : 0;
  const timing = j.timed
    ? `<span>p50 <b>${dur(j.p50_total)}</b></span>
       <span>p95 <b>${dur(j.p95_total)}</b></span>
       <span>queue share <b>${j.queue_share.toFixed(0)}%</b></span>`
    : `<span class="muted">no completion times recorded</span>`;

  const flags = (j.anomalies||[]).map(a =>
    `<span class="chip flag ${sev(a.severity).cls}"
       ><span class="g" aria-hidden="true">${sev(a.severity).g}</span>${esc(ANOM[a.type]||a.type)}</span>`).join("");

  return `<article class="jbox sev-${esc(j.severity)}${flagged?" flagged":""}" role="button" tabindex="0"
      data-job="${esc(j.job)}" aria-pressed="${S.job===j.job}"
      aria-label="${esc(j.job)}: ${j.count} tasks, ${flagged?`${j.anomaly_count} anomaly signals, severity ${j.severity}`:"no anomalies"}">
    <div class="jb-top">
      <span class="jb-name">${esc(j.job)}</span>
      <span class="jb-sev">${sevChip(j.severity, flagged ? j.anomaly_count : 0)}</span>
    </div>
    <div class="jb-fig">
      <span class="n">${n0(j.count)}</span><span class="u">tasks</span>
      <span class="share">${share.toFixed(1)}% of window</span>
    </div>
    <div class="meter" role="img" aria-label="${segs.map(s=>`${s.n} ${s.label}`).join(", ")}">
      ${segs.map(s=>`<i style="width:${(s.n/total*100).toFixed(2)}%;background:${s.c}"></i>`).join("")}
    </div>
    <div class="jb-legend">
      <span><i class="dot d-complete"></i><b>${n0(j.completed)}</b> done</span>
      <span><i class="dot d-terminal"></i><b>${n0(j.terminal)}</b> failed</span>
      <span><i class="dot d-queued"></i><b>${n0(j.in_queue)}</b> queued</span>
      <span><i class="dot d-active"></i><b>${n0(j.active)}</b> running</span>
      ${dropped?`<span><i class="dot d-dropped"></i><b>${n0(dropped)}</b> cancelled</span>`:""}
    </div>
    <div class="jb-stats">
      ${timing}
      <span>fail <b>${pct(j.terminal_pct)}</b></span>
    </div>
    ${sparkSVG(j.spark, j.job)}
    ${flagged
      ? `<div class="jb-flags">${flags}<span class="jb-cta" data-goto="rca">Why? →</span></div>`
      : `<div class="jb-ok">No anomaly signals for this job type.</div>`}
  </article>`;
}

function renderJobs(){
  const all = S.stats.job_health || [];
  const q = S.jobQuery.trim().toLowerCase();
  let list = all.filter(j => !S.flaggedOnly || j.anomaly_count > 0)
                .filter(j => !q || j.job.toLowerCase().includes(q));
  list = [...list].sort(JOB_SORTS[S.sort] || JOB_SORTS.severity);

  el("jobs-hint").textContent =
    `${list.length} of ${all.length} shown · ${S.stats.anomalous_jobs} flagged · ` +
    `click a box to drill down`;
  el("jobgrid").innerHTML = list.length
    ? list.map(jobBox).join("")
    : `<div class="card empty" style="grid-column:1/-1">No job type matches this filter.</div>`;
  el("f-all").setAttribute("aria-pressed", String(!S.flaggedOnly));
  el("f-flagged").setAttribute("aria-pressed", String(S.flaggedOnly));
}

/* ═══════════════════════════════════════════════════════════════════════
   Drill-down panel — scoped to one job, or to the whole system
   ═══════════════════════════════════════════════════════════════════════ */
function scope(){
  if(S.job && S.detail){
    const m = S.detail.metrics;
    return {job:S.job, m, anomalies:S.detail.anomalies||[], severity:S.detail.severity,
            throughput:S.detail.throughput, d:S.detail, count:m.count};
  }
  const s = S.stats, k = s.kpis, b = s.baselines;
  return {job:null, m:null, anomalies:[], severity:s.worst_severity,
          throughput:s.throughput, d:null, count:k.total_tasks, k, b};
}

function renderPanel(){
  destroyCharts();
  syncHash();
  const sc = scope();
  const p = el("panel");
  const tabs = [
    {id:"throughput", label:"Throughput analysis"},
    {id:"dist",       label:"Distributions"},
    {id:"tasks",      label:"Task details", cnt:n0(sc.count)},
    {id:"rca",        label:sc.job ? "Anomalies & RCA" : "Anomaly board",
     cnt: sc.job ? (sc.anomalies.length || 0) : S.stats.anomaly_total},
  ];
  if(!["throughput","dist","tasks","rca"].includes(S.tab)) S.tab = "throughput";

  let head;
  if(sc.job){
    const m = sc.m;
    head = `<div class="panel-head">
      <div>
        <h2>${esc(sc.job)} ${sevChip(sc.severity, sc.anomalies.length)}</h2>
        <div class="panel-sub">${n0(m.count)} tasks · ${esc(m.first_seen)} → ${esc(m.last_seen)}
          · p50 ${dur(m.p50_total)} · p95 ${dur(m.p95_total)} · ${m.queue_share.toFixed(0)}% of elapsed time is queue wait</div>
      </div>
      <div class="right">
        <button class="ghost" id="btn-close-job">Close ✕</button>
      </div>
    </div>`;
  }else{
    head = `<div class="panel-head">
      <div>
        <h2>All job types</h2>
        <div class="panel-sub">System view · ${n0(sc.count)} tasks · select a job box above to scope this panel</div>
      </div>
    </div>`;
  }

  p.innerHTML = head + `<div class="tabs" role="tablist">${
    tabs.map(t => `<button role="tab" data-tab="${t.id}" aria-selected="${S.tab===t.id}"
      >${esc(t.label)}${t.cnt!=null?`<span class="cnt">${t.cnt}</span>`:""}</button>`).join("")
  }</div><div class="tabbody" id="tabbody"></div>`;

  const body = el("tabbody");
  if(S.tab === "throughput") renderThroughput(body, sc);
  if(S.tab === "dist")       renderDist(body, sc);
  if(S.tab === "tasks")      renderTasks(body, sc);
  if(S.tab === "rca")        renderRCA(body, sc);
}

/* ── tab 1: throughput analysis ─────────────────────────────────────── */
function renderThroughput(body, sc){
  const tp = sc.throughput || {points:[], bucket:"day"};
  const pts = tp.points || [];
  if(!pts.length){ body.innerHTML = `<div class="empty">No completed tasks in this window.</div>`; return; }
  const unit = BUCKET_WORD[tp.bucket] || tp.bucket;

  body.innerHTML = `<div class="grid2">
    ${chartCard("c-tp", `Tasks reaching an end state per ${unit}`,
      `${pts.length} ${unit} buckets · bucket width follows the window length`, {span:true, h:"tall"})}
    ${chartCard("c-lat", `Completion time per ${unit}`, "Mean and 95th percentile of INITIAL → end")}
    ${chartCard("c-split", "Where the elapsed time goes",
      "Mean queue wait and mean translation time, stacked to the mean total")}
  </div>`;

  const labels = pts.map(p => p.t);

  mkChart("c-tp", {
    type:"bar",
    data:{labels, datasets:[
      {label:"Completed", data:pts.map(p=>p.ok), backgroundColor:C.blue, stack:"s", ...BAR, ...GAP_TOP},
      {label:"Failed", data:pts.map(p=>p.fail), backgroundColor:C.red, stack:"s", ...BAR},
    ]},
    options:{scales:{x:{...AX.x, stacked:true},
                     y:{...AX.y, stacked:true, title:{display:true, text:"tasks", color:C.ink3}}},
      interaction:{mode:"index", intersect:false},
      plugins:{tooltip:{callbacks:{
        footer:it => `total ${n0(it.reduce((a,x)=>a+x.parsed.y,0))} tasks`,
        label:c => ` ${n0(c.parsed.y)} ${c.dataset.label.toLowerCase()}`}}}},
  });
  fillTable("c-tp", [unit, "Completed", "Failed", "Total"],
    pts.map(p => [p.t, n0(p.ok), n0(p.fail), n0(p.count)]));

  mkChart("c-lat", {
    type:"line",
    data:{labels, datasets:[
      {label:"Mean", data:pts.map(p=>p.avg_total), borderColor:C.blue,
       backgroundColor:"rgba(42,120,214,.10)", fill:true},
      {label:"p95",  data:pts.map(p=>p.p95_total), borderColor:C.orange, borderDash:[4,3]},

      {label:"Queue wait", data:pts.map(p=>p.avg_queue), borderColor:C.blue,
       backgroundColor:"rgba(42,120,214,.14)", fill:true},

async function loadTasks(sc){
  const t = S.table;
  const holder = el("t-holder");
  if(!holder) return;
  holder.innerHTML = `<div class="working"><span class="spinner"></span>Loading task rows…</div>`;
  try{
    const res = await getJSON("/api/tasks?" + qs({job:sc.job, status:t.status==="all"?"":t.status,
      q:t.q, sort:t.sort, limit:t.limit, offset:t.offset}));
    t.total = res.total; t.rows = res.rows;
    drawTaskTable(sc);
  }catch(e){
    holder.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function drawTaskTable(sc){
  const t = S.table, holder = el("t-holder");
  if(!holder) return;
  if(!t.rows.length){
    holder.innerHTML = `<div class="empty">No task matches this filter.</div>`;
    el("t-count").textContent = "0 rows";
    return;
  }
  const showJob = !sc.job;
  const cols = ["Task id", ...(showJob?["Job type"]:[]), "User", "Group", "Target", "Provider",
                "State", "Queue", "Translation", "Total", "Started", "Ended"];
  holder.innerHTML = `<div class="tscroll"><table>
    <thead><tr>${cols.map((c,i)=>`<th${["Queue","Translation","Total"].includes(c)?' class="n"':""}>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>
      <td class="mono">${esc(r.task_id)}</td>
      ${showJob?`<td>${esc(r.job)}</td>`:""}
      <td>${esc(r.user)}</td><td>${esc(r.group)}</td>
      <td class="mono">${esc(r.target)}</td><td>${esc(r.provider)}</td>
      <td><span class="pill s-${esc(r.status)}">${esc(r.status)}</span></td>
      <td class="n">${dur(r.queue_min)}</td><td class="n">${dur(r.proc_min)}</td>
      <td class="n">${dur(r.total_min)}</td>
      <td class="mono">${esc(r.initial)}</td><td class="mono">${esc(r.end_time || "—")}</td>
    </tr>`).join("")}</tbody></table></div>
    <div class="pager">
      <span>${n0(t.offset+1)}–${n0(t.offset+t.rows.length)} of ${n0(t.total)}</span>
      <button class="ghost" id="t-prev" ${t.offset<=0?"disabled":""}>← Prev</button>
      <button class="ghost" id="t-next" ${t.offset+t.limit>=t.total?"disabled":""}>Next →</button>
    </div>`;
  el("t-count").textContent = `${n0(t.total)} matching tasks`;
  el("t-prev").onclick = () => { S.table.offset = Math.max(0, t.offset - t.limit); loadTasks(sc); };
  el("t-next").onclick = () => { S.table.offset = t.offset + t.limit; loadTasks(sc); };
}

/* ── tab 4: anomalies + root cause analysis ─────────────────────────── */
/* What the two comparison bars are actually comparing, per detector. Only
   terminal_spike and queue_backlog compare against the system; latency_drift
   compares the job against its own past and high_variance compares its own
   tail against its own typical case, so a blanket "system baseline" label
   would misstate three of the five. */
const CMP = {
  terminal_spike:  ["this job type", "all job types"],
  queue_backlog:   ["this job type", "all job types"],
  latency_drift:   ["most recent tasks", "its own earlier tasks"],
  latency_outlier: ["this job type", "median of all job types"],
  high_variance:   ["p95 — worst case", "p50 — typical case"],
};

function anomCard(a){
  const isTime = a.unit === "min";
  const f = v => a.unit === "%" ? pct(v) : (isTime ? dur(v) : n0(v));
  const hasBase = a.baseline != null && a.metric !== "stalled";
  const top = Math.max(Number(a.value)||0, Number(a.baseline)||0) || 1;
  const [lval, lbase] = CMP[a.type] || ["this job type", "all job types"];
  const bars = hasBase ? `<div class="cmp">
      <span>${lval}</span>
      <span class="bar"><i style="width:${(a.value/top*100).toFixed(1)}%;background:var(--sev)"></i></span>
      <span class="val">${f(a.value)}</span>
      <span>${lbase}</span>
      <span class="bar"><i style="width:${(a.baseline/top*100).toFixed(1)}%;background:var(--line-3)"></i></span>
      <span class="val">${f(a.baseline)}</span>
    </div>` : "";
  const z = a.z != null ? ` · z=${Number(a.z).toFixed(1)}` : "";
  return `<div class="anom sev-${esc(a.severity)}">
    <h4>${sevChip(a.severity)} ${esc(a.title)}
      <span class="chip flag info">${esc(ANOM[a.type]||a.type)}</span>
      <span class="muted mono" style="font-size:11px">${esc(a.metric)}${z}</span></h4>
    <p>${esc(a.detail)}</p>
    ${bars}
    ${(a.sample||[]).length ? `<div class="samples"><span class="muted" style="font-size:11px">Example tasks</span>
      ${a.sample.map(id => `<button class="tid" data-tid="${esc(id)}"
        title="Show this task in Task details">${esc(id)}</button>`).join("")}</div>` : ""}
  </div>`;
}

function renderRCA(body, sc){
  if(!sc.job){
    // System-level anomaly board: every flagged job type, worst first.
    const flagged = (S.stats.job_health||[]).filter(j => j.anomaly_count > 0)
      .sort(JOB_SORTS.severity);
    if(!flagged.length){
      body.innerHTML = `<div class="empty">No job type is flagged in this window.</div>`;
      return;
    }
    body.innerHTML = `<div class="tbar"><span class="muted" style="font-size:12.5px">
      ${n0(S.stats.anomaly_total)} signals across ${flagged.length} job types.
      Open one to get root cause analysis and recommended actions.</span></div>
      <div class="tscroll"><table>
        <thead><tr><th>Job type</th><th>Severity</th><th class="n">Signals</th><th>Signal types</th>
          <th class="n">Tasks</th><th class="n">Fail</th><th class="n">Queued</th><th class="n">p50</th><th></th></tr></thead>
        <tbody>${flagged.map(j => `<tr>
          <td><b>${esc(j.job)}</b></td>
          <td>${sevChip(j.severity)}</td>
          <td class="n">${j.anomaly_count}</td>
          <td>${(j.anomalies||[]).map(a=>esc(ANOM[a.type]||a.type)).join(", ")}</td>
          <td class="n">${n0(j.count)}</td><td class="n">${pct(j.terminal_pct)}</td>
          <td class="n">${n0(j.in_queue)}</td><td class="n">${dur(j.p50_total)}</td>
          <td><button class="ghost" data-diagnose="${esc(j.job)}">Diagnose →</button></td>
        </tr>`).join("")}</tbody></table></div>`;
    return;
  }

  const anomalies = sc.anomalies;
  const r = S.rca;
  body.innerHTML = `
    <div class="tbar">
      <span class="muted" style="font-size:12.5px">${anomalies.length
        ? `${anomalies.length} signal(s) for this job type, worst first.`
        : "No anomaly signal for this job type — RCA will still profile it."}</span>
      <div class="right">
        <button class="primary" id="btn-rca" ${r.loading?"disabled":""}>
          ${r.loading?`<span class="spinner"></span> Analysing…`:"Root cause analysis"}</button>
        <button class="ghost" id="btn-rca-rules" ${r.loading?"disabled":""}
          title="Skip the LLM and use the deterministic playbook">Rules only</button>
      </div>
    </div>
    ${anomalies.map(anomCard).join("")}
    <div id="rca-holder">${
      r.loading ? `<div class="working"><span class="spinner"></span>
        Correlating timings, failures, submitters and providers…</div>`
      : (r.data && r.forJob === sc.job) ? rcaHTML(r.data)
      : `<div class="rca"><p class="lead" style="margin:0">Run the analysis to get likely causes ranked by
         likelihood, the actions to take now, and the checks to confirm each cause.</p></div>`}
    </div>`;
}

function rcaHTML(r){
  if(r.status === "error" && !r.causes.length)
    return `<div class="rca"><div class="notice">${esc(r.error||"Analysis failed.")}</div></div>`;
  const byHorizon = ["immediate","short_term","preventive"].map(h =>
    [h, (r.actions||[]).filter(a => a.horizon === h)]).filter(([,as]) => as.length);
  return `<div class="rca">
    ${r.error ? `<div class="notice">${esc(r.error)} — showing the deterministic playbook instead.</div>` : ""}
    <h3>Root cause analysis · ${esc(r.job)} ${sevChip(r.severity)}</h3>
    <p class="lead">${esc(r.summary)}</p>
    <div class="primary-cause">
      <div class="k">Most likely root cause</div>
      <div class="t">${esc(r.primary_cause)}</div>
      ${r.impact?`<p class="ev" style="margin-top:6px;font-size:12.5px;color:var(--ink-2)">${esc(r.impact)}</p>`:""}
    </div>

    <h4>Likely causes · ranked</h4>
    <ul class="rlist">${(r.causes||[]).map((c,i) => `<li>
      <div class="hd"><span class="idx">${i+1}</span>${esc(c.cause)}
        <span class="chip info">${esc(CAT[c.category]||c.category)}</span>
        <span class="chip ${c.likelihood==="high"?"serious":c.likelihood==="medium"?"warning":"info"}"
          >${esc(c.likelihood)} likelihood</span></div>
      <p class="ev">${esc(c.evidence)}</p></li>`).join("")}</ul>

    <h4>Recommended actions</h4>
    ${byHorizon.map(([h,as]) => `
      <div style="margin-bottom:10px">
        <div class="muted" style="font-size:11.5px;margin-bottom:5px">${HORIZON[h]}</div>
        <ul class="rlist">${as.map(a => `<li>
          <div class="hd">${esc(a.action)}
            <span class="chip ${PRIO_CLS[a.priority]||"info"}">${esc(a.priority)}</span></div>
          <p class="meta"><b>Why:</b> ${esc(a.rationale)}</p>
          <p class="meta"><b>Expected impact:</b> ${esc(a.expected_impact)}</p></li>`).join("")}</ul>
      </div>`).join("")}

    ${(r.checks||[]).length ? `<h4>Confirm before acting</h4>
      <ul class="checks">${r.checks.map(c => `<li><span>${esc(c.check)}</span>
        <span class="where">${esc(c.where)}</span></li>`).join("")}</ul>` : ""}

    <div class="provenance">
      <span>source: ${esc(r.source === "bedrock" ? "Bedrock LLM" : "rule-based playbook")}</span>
      <span>status: ${esc(r.status)}</span>
      <span>confidence: ${r.confidence!=null?Number(r.confidence).toFixed(2):"—"}</span>
      <span>signals: ${(r.anomaly_types||[]).join(", ") || "none"}</span>
      <button class="ghost" id="btn-rca-copy" style="margin-left:auto">Copy as text</button>
    </div>
  </div>`;
}

async function runRCA(mode){
  if(!S.job || S.rca.loading) return;
  S.rca = {loading:true, data:null, forJob:S.job};
  renderPanel();
  try{
    S.rca.data = await getJSON("/api/rca?" + qs({job:S.job, mode:mode||""}));
  }catch(e){
    S.rca.data = {status:"error", source:"none", job:S.job, severity:S.detail.severity,
      anomaly_types:[], summary:"", primary_cause:"", impact:"", causes:[], actions:[],
      checks:[], confidence:0, error:e.message};
  }finally{
    S.rca.loading = false;
    renderPanel();
  }
}

function rcaText(r){
  const L = [];
  L.push(`ROOT CAUSE ANALYSIS — ${r.job}  [${r.severity}]`);
  L.push(`source=${r.source} status=${r.status} confidence=${r.confidence}`);
  L.push(`signals: ${(r.anomaly_types||[]).join(", ")}`, "", r.summary, "",
         `PRIMARY CAUSE: ${r.primary_cause}`, `IMPACT: ${r.impact}`, "", "LIKELY CAUSES");
  (r.causes||[]).forEach((c,i) => L.push(
    `${i+1}. [${c.likelihood}/${c.category}] ${c.cause}`, `   evidence: ${c.evidence}`));
  L.push("", "ACTIONS");
  (r.actions||[]).forEach(a => L.push(
    `- [${a.horizon}/${a.priority}] ${a.action}`, `  why: ${a.rationale}`, `  impact: ${a.expected_impact}`));
  if((r.checks||[]).length){
    L.push("", "CHECKS");
    (r.checks||[]).forEach(c => L.push(`- ${c.check}  (${c.where})`));
  }
  return L.join("\n");
}

/* ═══════════════════════════════════════════════════════════════════════
   AI analysis card
   ═══════════════════════════════════════════════════════════════════════ */
async function runAI(){
  const btn = el("btn-ai"), body = el("ai-body");
  btn.disabled = true;
  body.innerHTML = `<div class="working"><span class="spinner"></span>
    Reading the snapshot with Bedrock…</div>`;
  try{
    const r = await getJSON("/api/analysis?" + qs());
    body.innerHTML = `
      ${r.error?`<div class="notice">${esc(r.error)}</div>`:""}
      <p class="lead" style="font-size:13.5px;margin:0 0 10px">${esc(r.executive_summary||"")}</p>
      <p style="font-size:12.5px;color:var(--ink-2);margin:0 0 14px">${esc(r.health_assessment||"")}</p>
      ${(r.anomalies||[]).length?`<h4 style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;
        color:var(--ink-3);margin:0 0 8px">Anomalies</h4>
        <ul class="rlist" style="margin-bottom:14px">${r.anomalies.map(a=>`<li>
          <div class="hd">${esc(a.title||a.description||"")}
            ${a.severity?`<span class="chip ${sev(a.severity).cls}">${esc(a.severity)}</span>`:""}</div>
          ${a.description&&a.title?`<p class="ev">${esc(a.description)}</p>`:""}</li>`).join("")}</ul>`:""}
      ${(r.recommendations||[]).length?`<h4 style="font-size:11px;letter-spacing:.06em;
        text-transform:uppercase;color:var(--ink-3);margin:0 0 8px">Recommendations</h4>
        <ul class="rlist">${r.recommendations.map(x=>`<li>
          <div class="hd">${esc(x.title)}
            <span class="chip ${PRIO_CLS[x.priority]||"info"}">${esc(x.priority)}</span></div>
          <p class="ev">${esc(x.description)}</p></li>`).join("")}</ul>`:""}
      <div class="provenance"><span>status: ${esc(r.status)}</span>
        <span>confidence: ${r.confidence!=null?Number(r.confidence).toFixed(2):"—"}</span>
        ${r.health_score!=null?`<span>health score: ${Number(r.health_score).toFixed(0)}/100</span>`:""}</div>`;
  }catch(e){
    body.innerHTML = `<div class="notice">${esc(e.message)}</div>`;
  }finally{ btn.disabled = false; }
}

/* ═══════════════════════════════════════════════════════════════════════
   Date filter — presets anchor to the newest log data, not to today
   ═══════════════════════════════════════════════════════════════════════ */
const MONTHS = {january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,
  september:8,october:9,november:10,december:11,jan:0,feb:1,mar:2,apr:3,jun:5,jul:6,
  aug:7,sep:8,oct:9,nov:10,dec:11};
const fmtDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
/** The logs are historical, so "last 7 days" means the last 7 days *of data*. */
function anchorDate(){
  const to = S.stats && S.stats.data_span && S.stats.data_span.to;
  return to ? new Date(to + "T12:00:00") : new Date();
}

function parseNL(raw){
  const txt = (raw||"").trim().toLowerCase();
  if(!txt) return null;

  let m = txt.match(/(\d+)(?:st|nd|rd|th)?\s+week\s+of\s+([a-z]+)\s+(\d{4})/);
  if(m){
    const week=+m[1], mo=MONTHS[m[2]], yr=+m[3];
    if(mo==null||isNaN(yr)||week<1||week>5) return {error:`Can't parse "${raw}"`};
    const from = new Date(yr, mo, 1+(week-1)*7);
    let to = new Date(yr, mo, 1+(week-1)*7+6);
    const monthEnd = new Date(yr, mo+1, 0);
    if(from > monthEnd) return {error:`Week ${week} doesn't exist in that month`};
    return {from:fmtDate(from), to:fmtDate(to>monthEnd?monthEnd:to)};
  }
  m = txt.match(/q([1-4])\s*(?:of\s*)?(\d{4})/);
  if(m){ const q=+m[1]-1, yr=+m[2];
    return {from:fmtDate(new Date(yr,q*3,1)), to:fmtDate(new Date(yr,q*3+3,0))}; }
  m = txt.match(/^(\d{4})$/);
  if(m) return {from:`${m[1]}-01-01`, to:`${m[1]}-12-31`};
  m = txt.match(/^([a-z]+)\s+(\d{4})$/);
  if(m && MONTHS[m[1]]!=null){ const mo=MONTHS[m[1]], yr=+m[2];
    return {from:fmtDate(new Date(yr,mo,1)), to:fmtDate(new Date(yr,mo+1,0))}; }
  m = txt.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]+)\s+(\d{4})$/);
  if(m && MONTHS[m[2]]!=null)
    return {from:fmtDate(new Date(+m[3],MONTHS[m[2]],+m[1])),
            to:  fmtDate(new Date(+m[3],MONTHS[m[2]],+m[1]))};
  m = txt.match(/^(?:between|from)?\s*(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]+)(?:\s+(\d{4}))?\s+(?:and|to)\s+(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]+)(?:\s+(\d{4}))?$/);
  if(m && MONTHS[m[2]]!=null && MONTHS[m[5]]!=null){
    const fromYr = m[3]?+m[3]:(m[6]?+m[6]:null), toYr = m[6]?+m[6]:(m[3]?+m[3]:null);
    if(fromYr && toYr) return {from:fmtDate(new Date(fromYr,MONTHS[m[2]],+m[1])),
                               to:fmtDate(new Date(toYr,MONTHS[m[5]],+m[4]))};
  }
  m = txt.match(/last\s+(?:(\d+)\s+)?(day|week|month|year)s?/);
  if(m){
    const n=m[1]?+m[1]:1, unit=m[2], to=anchorDate(), from=new Date(to);
    if(unit==="day")   from.setDate(from.getDate()-n);
    if(unit==="week")  from.setDate(from.getDate()-n*7);
    if(unit==="month") from.setMonth(from.getMonth()-n);
    if(unit==="year")  from.setFullYear(from.getFullYear()-n);
    return {from:fmtDate(from), to:fmtDate(to)};
  }
  /* Free text beyond the patterns above needs chrono; without it, say what
     does work rather than leaving the user at a dead end. */
  if(typeof chrono === "undefined")
    return {error:'Try "March 2022", "Q3 2022", "2nd week of April 2022" or "last 30 days"'};
  /* Anchor relative phrases ("yesterday", "3 days ago") to the newest day in
     the logs, not to today — these are historical logs and the presets anchor
     the same way, so "yesterday" must mean the same thing in both. */
  const res = chrono.parse(raw, anchorDate());
  if(!res.length) return {error:`Could not understand "${raw}"`};
  if(res.length >= 2){
    const a=res[0].start.date(), b=res[1].start.date();
    return a<=b ? {from:fmtDate(a), to:fmtDate(b)} : {from:fmtDate(b), to:fmtDate(a)};
  }
  const r0 = res[0];
  if(r0.end) return {from:fmtDate(r0.start.date()), to:fmtDate(r0.end.date())};
  const d = r0.start.date();
  return {from:fmtDate(d), to:fmtDate(d)};
}

function setPreset(days){
  document.querySelectorAll("#presets button").forEach(b =>
    b.setAttribute("aria-pressed", String(+b.dataset.days === days)));
}
function applyWindow(from, to, {preset=null}={}){
  S.from = from || ""; S.to = to || "";
  el("d-from").value = S.from; el("d-to").value = S.to;
  setPreset(preset==null ? -1 : preset);
  S.table.offset = 0;
  S.rca = {loading:false, data:null, forJob:null};
  loadStats();
}

/* ═══════════════════════════════════════════════════════════════════════
   Events
   ═══════════════════════════════════════════════════════════════════════ */
el("presets").addEventListener("click", e => {
  const b = e.target.closest("button[data-days]");
  if(!b) return;
  const days = +b.dataset.days;
  if(!days){ el("nl").value=""; el("nl-note").innerHTML=""; applyWindow("", "", {preset:0}); return; }
  const to = anchorDate(), from = new Date(to);
  from.setDate(from.getDate() - days + 1);
  applyWindow(fmtDate(from), fmtDate(to), {preset:days});
});
el("btn-apply").onclick = () => applyWindow(el("d-from").value, el("d-to").value);
el("btn-clear").onclick = () => { el("nl").value=""; el("nl-note").innerHTML="";
  applyWindow("", "", {preset:0}); };
el("btn-reload").onclick = () => loadStats();
el("btn-ai").onclick = runAI;

el("nl").addEventListener("input", () => {
  const note = el("nl-note"), txt = el("nl").value;
  if(!txt.trim()){ note.innerHTML = ""; return; }
  const r = parseNL(txt);
  note.innerHTML = !r ? "" : r.error
    ? `<span class="bad">${esc(r.error)}</span>`
    : `<span class="ok">→ ${r.from} … ${r.to}</span>`;
});
/* The free-text parser is a module import, so it can land after the user has
   already typed; re-run the preview when it does. */
window.addEventListener("chrono-ready", () => {
  if(el("nl").value.trim()) el("nl").dispatchEvent(new Event("input"));
});
el("nl").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const r = parseNL(el("nl").value);
  if(!r) return;
  if(r.error){ el("nl-note").innerHTML = `<span class="bad">${esc(r.error)}</span>`; return; }
  applyWindow(r.from, r.to);
});

el("job-sort").onchange = e => { S.sort = e.target.value; renderJobs(); };
el("job-filter").addEventListener("input", e => { S.jobQuery = e.target.value; renderJobs(); });
el("f-all").onclick = () => { S.flaggedOnly = false; renderJobs(); };
el("f-flagged").onclick = () => { S.flaggedOnly = true; renderJobs(); };

/* Job boxes: whole box selects; the "Why? →" corner jumps straight to RCA. */
el("jobgrid").addEventListener("click", e => {
  const box = e.target.closest(".jbox");
  if(!box) return;
  const goto = e.target.closest("[data-goto]");
  selectJob(box.dataset.job, goto ? {tab:goto.dataset.goto, autoRCA:true} : {});
});
el("jobgrid").addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const box = e.target.closest(".jbox");
  if(!box) return;
  e.preventDefault();
  selectJob(box.dataset.job);
});

/* Panel is re-rendered wholesale, so delegate everything inside it. */
el("panel").addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){ S.tab = tab.dataset.tab; renderPanel(); return; }
  if(e.target.closest("#btn-close-job")){ selectJob(null); return; }
  if(e.target.closest("#btn-rca")){ runRCA(); return; }
  if(e.target.closest("#btn-rca-rules")){ runRCA("rules"); return; }
  if(e.target.closest("#btn-rca-copy")){
    const btn = e.target.closest("#btn-rca-copy");
    navigator.clipboard.writeText(rcaText(S.rca.data)).then(() => {
      btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy as text", 1600);
    });
    return;
  }
  const diag = e.target.closest("[data-diagnose]");
  if(diag){ selectJob(diag.dataset.diagnose, {tab:"rca", autoRCA:true}); return; }
  const tid = e.target.closest("[data-tid]");
  if(tid){                                   // sample task id → find it in the table
    S.table = {...S.table, q:tid.dataset.tid, status:"all", offset:0};
    S.tab = "tasks"; renderPanel(); return;
  }
});
el("panel").addEventListener("change", e => {
  const t = e.target;
  if(t.id === "t-status"){ S.table.status = t.value; S.table.offset = 0; }
  else if(t.id === "t-sort"){ S.table.sort = t.value; S.table.offset = 0; }
  else if(t.id === "t-limit"){ S.table.limit = +t.value; S.table.offset = 0; }
  else return;
  renderPanel();
});
let tq;
el("panel").addEventListener("input", e => {
  if(e.target.id !== "t-q") return;
  clearTimeout(tq);
  const v = e.target.value;
  tq = setTimeout(() => { S.table.q = v; S.table.offset = 0; loadTasks(scope());
    const a = el("t-csv");
    if(a) a.href = "/api/tasks.csv?" + qs({job:S.job, q:v,
      status:S.table.status==="all"?"":S.table.status, sort:S.table.sort});
  }, 260);
});

window.addEventListener("hashchange", () => {
  if(hashSelf){ hashSelf = false; return; }        // our own write, not a back button
  boot();
});

window.addEventListener("resize", () => {
  clearTimeout(window.__rs);
  window.__rs = setTimeout(() => Object.values(S.charts).forEach(c => c.resize()), 150);
});

/** Restore job / tab / window from the URL hash, then fetch. */
function boot(){
  const job = readHash();
  el("d-from").value = S.from; el("d-to").value = S.to;
  setPreset((S.from || S.to) ? -1 : 0);
  S.job = job;                     // loadStats() picks this up and fetches the detail
  loadStats().then(() => {
    if(S.job && S.tab === "rca" && hashRCA) runRCA(hashRCA === "rules" ? "rules" : "");
    hashRCA = null;
  });
}
boot();
</script>
</body>
</html>
